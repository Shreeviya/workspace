<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscription Billing Exception Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--secondary:#64748b;
  --success:#16a34a;--warning:#d97706;--danger:#dc2626;--info:#0891b2;
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#94a3b8;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-md:0 4px 6px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* ---- LAYOUT ---- */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{font-weight:700;font-size:18px;letter-spacing:-.3px}
.topbar-subtitle{font-size:12px;opacity:.75}
.topbar-right{display:flex;align-items:center;gap:16px}
.notif-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:16px}
.notif-badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;font-size:13px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--primary);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.main-content{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:var(--secondary);font-size:13px;font-weight:500;border-left:3px solid transparent;transition:.15s}
.nav-item:hover{background:#f8fafc;color:var(--text)}
.nav-item.active{color:var(--primary);border-left-color:var(--primary);background:#eff6ff}
.nav-icon{width:18px;text-align:center}
.page-area{flex:1;overflow-y:auto;padding:24px}
/* ---- KPI CARDS ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-top:3px solid transparent;position:relative;overflow:hidden}
.kpi-card.danger{border-top-color:var(--danger)}
.kpi-card.warning{border-top-color:var(--warning)}
.kpi-card.success{border-top-color:var(--success)}
.kpi-card.info{border-top-color:var(--info)}
.kpi-card.primary{border-top-color:var(--primary)}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:700;line-height:1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi-trend{position:absolute;top:18px;right:18px;font-size:20px;opacity:.15}
/* ---- TOOLBAR ---- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;max-width:360px;position:relative}
.search-box input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;outline:none;background:var(--surface)}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:none;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#f8fafc}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#b45309}
.btn-sm{padding:5px 10px;font-size:12px}
.filter-select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--text);cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--primary)}
/* ---- TABLE ---- */
.table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.table-title{font-weight:600;font-size:14px}
.table-count{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--text)}
thead th .sort-icon{margin-left:4px;opacity:.4}
thead th.sorted .sort-icon{opacity:1;color:var(--primary)}
tbody tr{border-bottom:1px solid var(--border);transition:.1s}
tbody tr:hover{background:#f8fafc;cursor:pointer}
tbody tr:last-child{border-bottom:none}
td{padding:11px 14px;font-size:13px;vertical-align:middle}
.priority-badge,.status-badge,.type-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.priority-critical{background:#fef2f2;color:#dc2626}
.priority-high{background:#fff7ed;color:#d97706}
.priority-medium{background:#fefce8;color:#ca8a04}
.priority-low{background:#f0fdf4;color:#16a34a}
.status-open{background:#eff6ff;color:#2563eb}
.status-pending{background:#fff7ed;color:#d97706}
.status-resolved{background:#f0fdf4;color:#16a34a}
.status-escalated{background:#fef2f2;color:#dc2626}
.status-approved{background:#f0fdf4;color:#16a34a}
.status-rejected{background:#fef2f2;color:#dc2626}
.type-usage{background:#f0f9ff;color:#0369a1}
.type-renewal{background:#fdf4ff;color:#9333ea}
.type-billing{background:#fff7ed;color:#d97706}
.owner-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.owner-avatar{width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.amount{font-family:'Courier New',monospace;font-weight:600}
.amount.negative{color:var(--danger)}
/* ---- PAGINATION ---- */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.page-btns{display:flex;gap:4px}
.page-btn{width:28px;height:28px;border-radius:4px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn:hover:not(.active){background:#f8fafc}
/* ---- DETAIL PANEL ---- */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;backdrop-filter:blur(2px)}
.panel-overlay.open{display:block}
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:680px;background:var(--surface);box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:101;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.detail-panel.open{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-head-left{display:flex;align-items:center;gap:10px}
.panel-title{font-size:16px;font-weight:700}
.panel-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px}
.panel-close:hover{color:var(--text)}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.panel-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;gap:0}
.panel-tab{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:.15s}
.panel-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.panel-tab:hover:not(.active){color:var(--text)}
/* ---- DETAIL SECTIONS ---- */
.section{margin-bottom:20px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.field-value{font-size:13px;color:var(--text)}
.field-value.highlight{font-weight:700;color:var(--danger)}
.field-full{grid-column:1/-1}
/* ---- PROGRESS BAR ---- */
.progress-bar{background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px;transition:.3s}
.fill-success{background:var(--success)}
.fill-warning{background:var(--warning)}
.fill-danger{background:var(--danger)}
/* ---- FORM ELEMENTS ---- */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text)}
.form-label .req{color:var(--danger);margin-left:2px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none;background:var(--surface)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-input.error,.form-select.error,.form-textarea.error{border-color:var(--danger)}
.form-error{font-size:11px;color:var(--danger);margin-top:3px}
.form-textarea{resize:vertical;min-height:80px}
/* ---- COMMENTS ---- */
.comment-list{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.comment{display:flex;gap:10px}
.comment-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.comment-body{flex:1;background:#f8fafc;border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border)}
.comment-meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.comment-text{font-size:13px}
/* ---- AUDIT TIMELINE ---- */
.timeline{display:flex;flex-direction:column;gap:0}
.timeline-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.timeline-item:not(:last-child)::before{content:'';position:absolute;left:14px;top:28px;bottom:0;width:2px;background:var(--border)}
.timeline-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1}
.dot-create{background:#eff6ff;color:var(--primary)}
.dot-update{background:#fff7ed;color:var(--warning)}
.dot-approve{background:#f0fdf4;color:var(--success)}
.dot-reject{background:#fef2f2;color:var(--danger)}
.dot-comment{background:#fdf4ff;color:#9333ea}
.dot-assign{background:#f0f9ff;color:var(--info)}
.timeline-content{flex:1}
.timeline-action{font-size:13px;font-weight:500}
.timeline-meta{font-size:11px;color:var(--muted);margin-top:2px}
/* ---- RECOMMENDED ACTIONS ---- */
.action-cards{display:flex;flex-direction:column;gap:8px}
.action-card{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;align-items:flex-start;gap:10px}
.action-icon{font-size:20px;flex-shrink:0}
.action-content{flex:1}
.action-title{font-size:13px;font-weight:600;margin-bottom:2px}
.action-desc{font-size:12px;color:var(--muted)}
.action-btn-group{display:flex;gap:6px;margin-top:8px}
/* ---- APPROVAL WORKFLOW ---- */
.workflow-steps{display:flex;align-items:center;gap:0;margin-bottom:16px}
.workflow-step{display:flex;align-items:center;gap:6px;flex:1}
.workflow-step:not(:last-child)::after{content:'';flex:1;height:2px;background:var(--border);margin:0 6px}
.workflow-step.done::after{background:var(--success)}
.step-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface);flex-shrink:0}
.workflow-step.done .step-circle{background:var(--success);border-color:var(--success);color:#fff}
.workflow-step.active .step-circle{background:var(--primary);border-color:var(--primary);color:#fff}
.workflow-step.rejected .step-circle{background:var(--danger);border-color:var(--danger);color:#fff}
.step-label{font-size:11px;font-weight:500;color:var(--muted)}
/* ---- NOTIFICATIONS PANEL ---- */
.notif-dropdown{position:fixed;top:56px;right:24px;width:340px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:200;border:1px solid var(--border);display:none}
.notif-dropdown.open{display:block}
.notif-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.notif-list{max-height:360px;overflow-y:auto}
.notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s}
.notif-item:hover{background:#f8fafc}
.notif-item.unread{background:#eff6ff}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:4px}
.notif-dot.read{background:var(--border)}
.notif-text{font-size:13px}
.notif-time{font-size:11px;color:var(--muted);margin-top:2px}
.notif-footer{padding:10px 16px;text-align:center;font-size:12px;color:var(--primary);cursor:pointer;border-top:1px solid var(--border)}
/* ---- TOAST ---- */
.toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:500}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow-md);border-left:4px solid;font-size:13px;max-width:360px;animation:slideIn .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast.info{border-left-color:var(--info)}
.toast-icon{font-size:18px}
.toast-msg{flex:1}
.toast-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:translateX(20px)}}
/* ---- MODAL ---- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;backdrop-filter:blur(2px);align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:12px;width:460px;max-width:95vw;box-shadow:var(--shadow-md);max-height:90vh;overflow-y:auto}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
/* ---- USAGE CHARTS ---- */
.usage-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.usage-card{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.usage-card-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.3px}
.meter{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meter-label{font-size:12px;min-width:90px}
.meter-bar{flex:1;background:#e2e8f0;border-radius:4px;height:10px;overflow:hidden}
.meter-fill{height:100%;border-radius:4px}
.meter-val{font-size:11px;font-weight:600;min-width:40px;text-align:right}
/* ---- MISC ---- */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.divider{height:1px;background:var(--border);margin:16px 0}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;background:#f1f5f9;color:var(--secondary)}
.chip-group{display:flex;flex-wrap:wrap;gap:4px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row-key{color:var(--muted);font-weight:500}
.sla-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px}
.sla-ok{background:#f0fdf4;color:var(--success)}
.sla-warn{background:#fff7ed;color:var(--warning)}
.sla-breach{background:#fef2f2;color:var(--danger)}
@media(max-width:768px){
  .sidebar{display:none}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .detail-panel{width:100%}
  .field-grid{grid-template-columns:1fr}
  .usage-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="topbar-logo">⚡ BillingOps</div>
        <div class="topbar-subtitle">Subscription Exception Management</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="notif-btn" onclick="toggleNotif()" id="notifBtn">🔔<span class="notif-badge" id="notifCount">5</span></button>
      <div class="user-chip">
        <div class="user-avatar">JD</div>
        <span>John Doe</span>
        <span>▾</span>
      </div>
    </div>
  </div>
  <!-- NOTIFICATIONS DROPDOWN -->
  <div class="notif-dropdown" id="notifDropdown">
    <div class="notif-header">
      Notifications
      <button class="btn btn-sm btn-secondary" onclick="markAllRead()">Mark all read</button>
    </div>
    <div class="notif-list" id="notifList"></div>
    <div class="notif-footer" onclick="closeNotif()">View all notifications</div>
  </div>
  <!-- MAIN -->
  <div class="main-content">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="nav-item active" onclick="setPage('dashboard')" id="nav-dashboard"><span class="nav-icon">📊</span> Dashboard</div>
      <div class="nav-item" onclick="setPage('exceptions')" id="nav-exceptions"><span class="nav-icon">⚠️</span> Exceptions</div>
      <div class="nav-item" onclick="setPage('usage')" id="nav-usage"><span class="nav-icon">📈</span> Usage</div>
      <div class="nav-item" onclick="setPage('renewals')" id="nav-renewals"><span class="nav-icon">🔄</span> Renewals</div>
      <div class="nav-item" onclick="setPage('reports')" id="nav-reports"><span class="nav-icon">📋</span> Reports</div>
      <div style="margin-top:auto;padding:16px 20px;font-size:11px;color:var(--muted)">v2.4.1 · Sep 2026</div>
    </div>
    <!-- PAGE AREA -->
    <div class="page-area" id="pageArea"></div>
  </div>
</div>

<!-- DETAIL PANEL OVERLAY -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="panel-head">
    <div class="panel-head-left">
      <button class="panel-close" onclick="closePanel()">✕</button>
      <div>
        <div class="panel-title" id="panelTitle">Exception Detail</div>
        <div id="panelSubtitle" style="font-size:12px;color:var(--muted)"></div>
      </div>
    </div>
    <div id="panelStatusBadge"></div>
  </div>
  <div class="panel-tabs">
    <div class="panel-tab active" onclick="switchTab('details')" id="tab-details">Details</div>
    <div class="panel-tab" onclick="switchTab('usage')" id="tab-usage">Usage & Renewal</div>
    <div class="panel-tab" onclick="switchTab('actions')" id="tab-actions">Actions</div>
    <div class="panel-tab" onclick="switchTab('comments')" id="tab-comments">Comments</div>
    <div class="panel-tab" onclick="switchTab('history')" id="tab-history">History</div>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-footer" id="panelFooter"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">

    let va = a[sortCol], vb = b[sortCol];
    if(typeof va === 'string') va = va.toLowerCase(), vb = vb.toLowerCase();
    if(sortDir === 'asc') return va > vb ? 1 : -1;
    return va < vb ? 1 : -1;
  });
  const total = data.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  const paged = data.slice((currentPage_table-1)*PAGE_SIZE, currentPage_table*PAGE_SIZE);

  const sortIcon = (col) => `<span class="sort-icon">${sortCol===col?(sortDir==='asc'?'↑':'↓'):'↕'}</span>`;

      <span class="table-title">Exceptions <span class="table-count">(${total} total)</span></span>
      ${compact?`<button class="btn btn-sm btn-secondary" onclick="setPage('exceptions')">View All</button>`:''}

    <table>
      <thead>
        <tr>

    </div>
  </div>`;
}

// ===================== DETAIL PANEL =====================
function openDetail(id){
  currentException = exceptionData.find(e => e.id === id);
  if(!currentException) return;
  document.getElementById('panelTitle').textContent = currentException.id + ' — ' + currentException.customer;
  document.getElementById('panelSubtitle').textContent = currentException.subId + ' · ' + currentException.plan;
  document.getElementById('panelStatusBadge').innerHTML = `<span class="status-badge status-${currentException.status}">${currentException.status}</span>`;
  currentTab = 'details';
  renderPanelTab();
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  // update active tab
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-details').classList.add('active');
}

function closePanel(){
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderPanelTab();
}

function renderPanelTab(){
  const e = currentException;
  if(!e) return;
  const body = document.getElementById('panelBody');
  const footer = document.getElementById('panelFooter');
  if(currentTab === 'details'){
    body.innerHTML = renderDetailsTab(e);
    footer.innerHTML = `
      <button class="btn btn-secondary" onclick="openAssignModal()">👤 Reassign</button>
      <button class="btn btn-warning" onclick="openEscalateModal()">🚨 Escalate</button>
      <button class="btn btn-success" onclick="openResolveModal()">✅ Resolve</button>
      <button class="btn btn-danger" onclick="rejectException()" style="margin-left:auto">❌ Reject</button>`;
  } else if(currentTab === 'usage'){
    body.innerHTML = renderUsageTab(e);
    footer.innerHTML = `<button class="btn btn-primary" onclick="openDetail('${e.id}')">🔄 Refresh Data</button>`;
  } else if(currentTab === 'actions'){
    body.innerHTML = renderActionsTab(e);
    footer.innerHTML = `<button class="btn btn-primary" onclick="approveException()">✅ Approve & Execute</button><button class="btn btn-secondary" onclick="switchTab('comments')">💬 Add Comment</button>`;
  } else if(currentTab === 'comments'){
    body.innerHTML = renderCommentsTab(e);
    footer.innerHTML = '';
  } else if(currentTab === 'history'){
    body.innerHTML = renderHistoryTab(e);
    footer.innerHTML = '';
  }
}

  const notes = document.getElementById('resolveNotes').value.trim();
  let valid = true;
  if(!type){document.getElementById('resolveTypeError').style.display='block';valid=false;}else{document.getElementById('resolveTypeError').style.display='none';}
  if(!notes){document.getElementById('resolveNotesError').style.display='block';valid=false;}else{document.getElementById('resolveNotesError').style.display='none';}
  if(!valid) return;
  currentException.status = 'resolved';
  currentException.sla = 'ok';
  closeModal();
  toast('Exception resolved successfully!', 'success');
  document.getElementById('panelStatusBadge').innerHTML = `<span class="status-badge status-resolved">resolved</span>`;
  renderPanelTab();
  refreshPage();
}

function openCreditModal(){
  openModal('Issue Credit Note',
    `<div class="form-group"><label class="form-label">Credit Amount<span class="req">*</span></label>
    <input type="number" class="form-input" id="creditAmount" value="${Math.round(currentException.amount*0.1)}" placeholder="Amount in USD"></div>
    <div class="form-group"><label class="form-label">Credit Reason<span class="req">*</span></label>
    <select class="form-select" id="creditReason">
      <option>Billing Error</option><option>Service Disruption</option><option>Goodwill Gesture</option><option>Contract Dispute</option><option>Overage Waiver</option>
    </select></div>
    <div class="form-group"><label class="form-label">Notes</label>
    <textarea class="form-textarea" id="creditNotes" placeholder="Additional notes..."></textarea></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitCredit()">Issue Credit Note</button>`
  );
}

function submitCredit(){
  const amount = document.getElementById('creditAmount').value;
  if(!amount || amount <= 0){toast('Please enter a valid credit amount','error');return;}
  closeModal();
  toast(`Credit note of $${parseFloat(amount).toLocaleString()} issued successfully!`, 'success');
}

function openNewExceptionModal(){
  openModal('Create New Exception',
    `<div class="field-grid">
    <div class="form-group"><label class="form-label">Subscription ID<span class="req">*</span></label>
    <input class="form-input" id="newSubId" placeholder="SUB-XXXXX"></div>
    <div class="form-group"><label class="form-label">Exception Type<span class="req">*</span></label>
    <select class="form-select" id="newType"><option value="">Select Type</option><option>usage</option><option>renewal</option><option>billing</option></select></div>
    <div class="form-group"><label class="form-label">Customer Name<span class="req">*</span></label>
    <input class="form-input" id="newCustomer" placeholder="Customer name"></div>
    <div class="form-group"><label class="form-label">Financial Exposure ($)<span class="req">*</span></label>
    <input type="number" class="form-input" id="newAmount" placeholder="0.00"></div>
    <div class="form-group"><label class="form-label">Priority<span class="req">*</span></label>
    <select class="form-select" id="newPriority"><option value="">Select Priority</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select></div>
    <div class="form-group"><label class="form-label">Owner<span class="req">*</span></label>
    <select class="form-select" id="newOwner"><option value="">Assign Owner</option>${OWNERS.map(o=>`<option>${o}</option>`).join('')}</select></div>
    </div>
    <div class="form-group field-full"><label class="form-label">Description<span class="req">*</span></label>
    <textarea class="form-textarea" id="newDesc" placeholder="Describe the exception in detail..."></textarea></div>
    <div id="newExceptionErrors" style="color:var(--danger);font-size:12px;margin-top:8px"></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitNewException()">Create Exception</button>`
  );
}

function submitNewException(){
  const subId = document.getElementById('newSubId').value.trim();
  const type = document.getElementById('newType').value;
  const customer = document.getElementById('newCustomer').value.trim();
  const amount = document.getElementById('newAmount').value;
  const priority = document.getElementById('newPriority').value;
  const owner = document.getElementById('newOwner').value;
  const desc = document.getElementById('newDesc').value.trim();
  const errors = [];
  if(!subId) errors.push('Subscription ID');
  if(!type) errors.push('Exception Type');
  if(!customer) errors.push('Customer Name');
  if(!amount || amount <= 0) errors.push('Valid Financial Exposure');
  if(!priority) errors.push('Priority');
  if(!owner) errors.push('Owner');
  if(!desc) errors.push('Description');
  if(errors.length){
    document.getElementById('newExceptionErrors').textContent = '⚠️ Please fill in: ' + errors.join(', ');
    ['newSubId','newType','newCustomer','newAmount','newPriority','newOwner','newDesc'].forEach(id=>{
      const el = document.getElementById(id);
      if(el && !el.value) el.classList.add('error');
    });
    return;
  }
  const newId = 'EX-' + (2010 + exceptionData.length + 1);
  const today = new Date().toISOString().split('T')[0];
  exceptionData.unshift({
    id:newId,type,subId,customer,plan:'Custom Plan',amount:parseFloat(amount),priority,status:'open',
    owner,created:today,dueDate:today,aging:0,cycleTime:0,sla:'ok',description:desc,
    tags:[type],assignedGroup:'Billing Ops',escalated:false,approvalStep:1
  });
  closeModal();
  toast(`Exception ${newId} created successfully!`, 'success');
  refreshPage();
}

function rejectException(){
  openModal('Reject Exception',
    `<div class="form-group"><label class="form-label">Rejection Reason<span class="req">*</span></label>
    <textarea class="form-textarea" id="rejectReason" placeholder="Explain why this exception is being rejected..."></textarea>
    <div class="form-error" id="rejectReasonError" style="display:none">Reason is required</div></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="submitReject()">❌ Reject</button>`
  );
}

function submitReject(){
  const reason = document.getElementById('rejectReason').value.trim();
  if(!reason){document.getElementById('rejectReasonError').style.display='block';return;}
  currentException.status = 'resolved';
  closeModal();
  toast('Exception rejected and closed.', 'warning');
  document.getElementById('panelStatusBadge').innerHTML = `<span class="status-badge status-rejected">rejected</span>`;
  refreshPage();
}

function approveException(){
  if(currentException.approvalStep < 4){
    currentException.approvalStep++;
    toast(`Approved! Moved to step ${currentException.approvalStep} of 4.`, 'success');
    renderPanelTab();
    refreshPage();
  } else {
    currentException.status = 'resolved';
    toast('Exception fully approved and resolved!', 'success');
    closePanel();
    refreshPage();
  }
}

// ===================== COMMENTS =====================
function submitComment(exceptionId){
  const text = document.getElementById('newComment').value.trim();
  if(!text){document.getElementById('commentError').style.display='block';return;}
  document.getElementById('commentError').style.display='none';
  if(!COMMENTS_MAP[exceptionId]) COMMENTS_MAP[exceptionId] = [];
  COMMENTS_MAP[exceptionId].push({
    author:'John Doe',color:'#2563eb',
    time: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
    text
  });
  toast('Comment posted!', 'success');
  renderPanelTab();
}

// ===================== FILTERS & SORT =====================
function onSearch(val){ searchQuery = val; currentPage_table = 1; refreshPage(); }
function onFilterStatus(val){ filterStatus = val; currentPage_table = 1; refreshPage(); }
function onFilterPriority(val){ filterPriority = val; currentPage_table = 1; refreshPage(); }
function onFilterType(val){ filterType = val; currentPage_table = 1; refreshPage(); }
function clearFilters(){ searchQuery='';filterStatus='';filterPriority='';filterType=''; currentPage_table=1; refreshPage(); }
function onSort(col){ if(sortCol===col) sortDir = sortDir==='asc'?'desc':'asc'; else{sortCol=col;sortDir='desc';} refreshPage(); }
function gotoPage(p){ const max = Math.ceil(getFilteredData().length/PAGE_SIZE); if(p<1||p>max) return; currentPage_table=p; refreshPage(); }

function getFilteredData(){
  let data = [...exceptionData];
  if(searchQuery) data = data.filter(e => e.id.toLowerCase().includes(searchQuery.toLowerCase())||e.customer.toLowerCase().includes(searchQuery.toLowerCase()));
  if(filterStatus) data = data.filter(e => e.status===filterStatus);
  if(filterPriority) data = data.filter(e => e.priority===filterPriority);
  if(filterType) data = data.filter(e => e.type===filterType);
  return data;
}

function refreshPage(){ setPage(currentPage); }
function attachTableEvents(){}

// ===================== NOTIFICATIONS =====================
function renderNotifList(){
  const list = document.getElementById('notifList');
  list.innerHTML = NOTIFICATIONS.map(n => `
    <div class="notif-item ${n.read?'':'unread'}" onclick="readNotif(${n.id})">
      <div class="notif-dot ${n.read?'read':''}"></div>
      <div><div class="notif-text">${n.text}</div><div class="notif-time">${n.time}</div></div>
    </div>`).join('');
  const unread = NOTIFICATIONS.filter(n=>!n.read).length;
  document.getElementById('notifCount').textContent = unread;
  document.getElementById('notifCount').style.display = unread > 0 ? 'flex' : 'none';
}

function toggleNotif(){
  const dd = document.getElementById('notifDropdown');
  dd.classList.toggle('open');
}
function closeNotif(){ document.getElementById('notifDropdown').classList.remove('open'); }
function readNotif(id){
  NOTIFICATIONS.find(n=>n.id===id).read = true;
  renderNotifList();
}
function markAllRead(){
  NOTIFICATIONS.forEach(n=>n.read=true);
  renderNotifList();
  toast('All notifications marked as read', 'info');
  closeNotif();
}

document.addEventListener('click', (e) => {
  const dd = document.getElementById('notifDropdown');
  const btn = document.getElementById('notifBtn');
  if(!dd.contains(e.target) && !btn.contains(e.target)) dd.classList.remove('open');
});

// ===================== EXPORT =====================
function exportCSV(){
  const headers = ['ID','Type','Customer','Subscription','Plan','Amount','Priority','Status','Aging','SLA','Owner','Created'];
  const rows = exceptionData.map(e => [e.id,e.type,e.customer,e.subId,e.plan,e.amount,e.priority,e.status,e.aging,e.sla,e.owner,e.created]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  download('billing_exceptions.csv', csv, 'text/csv');
  toast('CSV exported successfully!', 'success');
}

function exportExcel(){
  // Generates a simple TSV that Excel can open
  const headers = ['ID','Type','Customer','Subscription','Plan','Amount','Priority','Status','Aging (days)','SLA','Owner','Created'];
  const rows = exceptionData.map(e => [e.id,e.type,e.customer,e.subId,e.plan,e.amount,e.priority,e.status,e.aging,e.sla,e.owner,e.created]);
  const tsv = [headers, ...rows].map(r => r.join('\t')).join('\n');
  download('billing_exceptions.xls', tsv, 'application/vnd.ms-excel');
  toast('Excel file exported successfully!', 'success');
}

function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ===================== TOAST =====================
function toast(msg, type='info'){
  const icons = {success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  const container = document.getElementById('toastContainer');
  const id = 't' + Date.now();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.id = id;
  el.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-msg">${msg}</span><button class="toast-close" onclick="removeToast('${id}')">✕</button>`;
  container.appendChild(el);
  setTimeout(() => removeToast(id), 4000);
}

function removeToast(id){
  const el = document.getElementById(id);
  if(el){ el.style.animation = 'fadeOut .3s ease forwards'; setTimeout(()=>el.remove(), 300); }
}

function showFieldError(id, msg){
  const el = document.getElementById(id);
  if(el) el.classList.add('error');
}
